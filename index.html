<!DOCTYPE html>
<html lang="es">
<head>
<link rel="manifest" href="manifest.json">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Vívora — Snake</title>
<style>
  :root{
    --bg: #0b1a12;
    --grid: #15281c;
    --snake: #9fef3f;
    --snake-head: #c8ff7a;
    --food: #ffb347;
    --panel: #10241a;
    --ink: #d8f5c9;
    --dim: #6f9a72;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; height:100%;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Courier New', Courier, monospace;
    overflow:hidden;
    touch-action:none;
    user-select:none;
  }
  body{
    display:flex; flex-direction:column; align-items:center;
    min-height:100vh;
    padding: env(safe-area-inset-top,12px) 12px env(safe-area-inset-bottom,12px);
  }
  .eyebrow{
    letter-spacing: 0.35em;
    font-size: 11px;
    color: var(--dim);
    margin-top: 10px;
    text-transform: uppercase;
  }
  h1{
    font-size: 28px;
    margin: 4px 0 10px;
    letter-spacing: 2px;
    color: var(--snake);
    text-shadow: 0 0 14px rgba(159,239,63,0.35);
  }
  .hud{
    display:flex; justify-content:space-between; width:100%;
    max-width: 420px;
    font-size: 14px;
    padding: 0 6px 8px;
    color: var(--dim);
  }
  .hud b{ color: var(--ink); }
  #wrap{
    position:relative;
    width:100%;
    max-width: 420px;
    aspect-ratio: 1 / 1;
    background: var(--panel);
    border: 2px solid #1f3a28;
    border-radius: 10px;
    box-shadow: inset 0 0 30px rgba(0,0,0,0.5), 0 0 20px rgba(159,239,63,0.06);
    overflow:hidden;
  }
  canvas{ display:block; width:100%; height:100%; }
  #overlay{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background: rgba(11,26,18,0.88);
    text-align:center;
    padding: 20px;
    gap: 14px;
  }
  #overlay h2{
    margin:0; font-size:20px; color:var(--snake-head); letter-spacing:1px;
  }
  #overlay p{ margin:0; font-size:13px; color:var(--dim); line-height:1.6; max-width:280px; }
  button.play{
    background: var(--snake);
    color: #0b1a12;
    border:none;
    font-family:inherit;
    font-weight:bold;
    font-size:15px;
    letter-spacing:1px;
    padding: 12px 28px;
    border-radius: 8px;
    cursor:pointer;
  }
  button.play:active{ transform: scale(0.97); }
  #pad{
    margin-top: 16px;
    display:grid;
    grid-template-columns: 62px 62px 62px;
    grid-template-rows: 62px 62px 62px;
    gap: 6px;
  }
  #pad button{
    background: var(--panel);
    border: 1px solid #1f3a28;
    color: var(--snake);
    font-size: 20px;
    border-radius: 10px;
    display:flex; align-items:center; justify-content:center;
  }
  #pad button:active{ background:#1a3323; }
  .up{ grid-column:2; grid-row:1; }
  .left{ grid-column:1; grid-row:2; }
  .down{ grid-column:2; grid-row:2; }
  .right{ grid-column:3; grid-row:2; }
  .hint{ font-size:11px; color:var(--dim); margin-top:10px; }
</style>
</head>
<body>
  <div class="eyebrow">jardín digital</div>
  <h1>VÍBORA</h1>
  <div class="hud"><span>PUNTOS <b id="score">0</b></span><span>MEJOR <b id="best">0</b></span></div>
  <div id="wrap">
    <canvas id="game"></canvas>
    <div id="overlay">
      <h2>Toca para empezar</h2>
      <p>Desliza el dedo o usá las flechas para mover la víbora. Comé las luciérnagas, no te choques.</p>
      <button class="play" id="playBtn">Jugar</button>
    </div>
  </div>
  <div id="pad">
    <button class="up" data-dir="up">▲</button>
    <button class="left" data-dir="left">◀</button>
    <button class="down" data-dir="down">▼</button>
    <button class="right" data-dir="right">▶</button>
  </div>
  <div class="hint">deslizá sobre el tablero o usá los botones</div>

<script>
(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const playBtn = document.getElementById('playBtn');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const wrap = document.getElementById('wrap');

  const COLS = 18;
  let cell, snake, dir, nextDir, food, score, best = 0, running, tickMs, timer;

  function resize(){
    const size = wrap.clientWidth;
    canvas.width = size * devicePixelRatio;
    canvas.height = size * devicePixelRatio;
    ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
    cell = size / COLS;
    draw();
  }
  window.addEventListener('resize', resize);

  function reset(){
    snake = [{x:8,y:9},{x:7,y:9},{x:6,y:9}];
    dir = {x:1,y:0};
    nextDir = {x:1,y:0};
    score = 0;
    tickMs = 140;
    scoreEl.textContent = score;
    placeFood();
  }

  function placeFood(){
    let ok = false, fx, fy;
    while(!ok){
      fx = Math.floor(Math.random()*COLS);
      fy = Math.floor(Math.random()*COLS);
      ok = !snake.some(s => s.x===fx && s.y===fy);
    }
    food = {x:fx, y:fy, pulse:0};
  }

  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    // grid
    ctx.strokeStyle = 'rgba(159,239,63,0.05)';
    ctx.lineWidth = 1;
    for(let i=1;i<COLS;i++){
      ctx.beginPath(); ctx.moveTo(i*cell,0); ctx.lineTo(i*cell,COLS*cell); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0,i*cell); ctx.lineTo(COLS*cell,i*cell); ctx.stroke();
    }
    // food (firefly glow)
    if(food){
      const cx = food.x*cell + cell/2, cy = food.y*cell + cell/2;
      const glow = 4 + Math.sin(food.pulse)*3;
      const grad = ctx.createRadialGradient(cx,cy,0,cx,cy,cell*0.9+glow);
      grad.addColorStop(0, 'rgba(255,179,71,0.9)');
      grad.addColorStop(1, 'rgba(255,179,71,0)');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(cx,cy,cell*0.9+glow,0,7); ctx.fill();
      ctx.fillStyle = '#ffb347';
      ctx.beginPath(); ctx.arc(cx,cy,cell*0.28,0,7); ctx.fill();
    }
    // snake
    snake.forEach((s,i)=>{
      const x = s.x*cell, y = s.y*cell;
      const r = i===0 ? cell*0.32 : cell*0.26;
      ctx.fillStyle = i===0 ? '#c8ff7a' : `rgba(159,239,63,${1 - i/(snake.length+6)})`;
      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(x+cell*0.08,y+cell*0.08,cell*0.84,cell*0.84,r) : ctx.rect(x+2,y+2,cell-4,cell-4);
      ctx.fill();
    });
  }

  function step(){
    dir = nextDir;
    const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

    if(head.x<0 || head.y<0 || head.x>=COLS || head.y>=COLS || snake.some(s=>s.x===head.x && s.y===head.y)){
      return gameOver();
    }
    snake.unshift(head);
    if(head.x===food.x && head.y===food.y){
      score++;
      scoreEl.textContent = score;
      tickMs = Math.max(70, tickMs - 3);
      placeFood();
      restartTimer();
    } else {
      snake.pop();
    }
    if(food) food.pulse += 0.3;
    draw();
  }

  function restartTimer(){
    clearInterval(timer);
    timer = setInterval(step, tickMs);
  }

  function gameOver(){
    running = false;
    clearInterval(timer);
    if(score > best){ best = score; bestEl.textContent = best; }
    overlay.querySelector('h2').textContent = 'Se acabó';
    overlay.querySelector('p').textContent = `Comiste ${score} luciérnaga${score===1?'':'s'}. Tocá para intentar de nuevo.`;
    playBtn.textContent = 'Reintentar';
    overlay.style.display = 'flex';
  }

  function start(){
    reset();
    running = true;
    overlay.style.display = 'none';
    restartTimer();
    draw();
  }

  playBtn.addEventListener('click', start);

  function setDir(dx,dy){
    if(!running) return;
    if(dx === -dir.x && dy === -dir.y) return; // no giro de 180
    nextDir = {x:dx,y:dy};
  }

  window.addEventListener('keydown', (e)=>{
    if(e.key==='ArrowUp') setDir(0,-1);
    else if(e.key==='ArrowDown') setDir(0,1);
    else if(e.key==='ArrowLeft') setDir(-1,0);
    else if(e.key==='ArrowRight') setDir(1,0);
  });

  document.querySelectorAll('#pad button').forEach(btn=>{
    btn.addEventListener('touchstart', (e)=>{
      e.preventDefault();
      const d = btn.dataset.dir;
      if(d==='up') setDir(0,-1);
      else if(d==='down') setDir(0,1);
      else if(d==='left') setDir(-1,0);
      else if(d==='right') setDir(1,0);
    });
    btn.addEventListener('click', ()=>{
      const d = btn.dataset.dir;
      if(d==='up') setDir(0,-1);
      else if(d==='down') setDir(0,1);
      else if(d==='left') setDir(-1,0);
      else if(d==='right') setDir(1,0);
    });
  });

  // swipe on board
  let touchStart = null;
  wrap.addEventListener('touchstart', (e)=>{
    touchStart = {x: e.touches[0].clientX, y: e.touches[0].clientY};
  }, {passive:true});
  wrap.addEventListener('touchend', (e)=>{
    if(!touchStart) return;
    const dx = e.changedTouches[0].clientX - touchStart.x;
    const dy = e.changedTouches[0].clientY - touchStart.y;
    if(Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
    if(Math.abs(dx) > Math.abs(dy)) setDir(dx>0?1:-1, 0);
    else setDir(0, dy>0?1:-1);
    touchStart = null;
  });

  resize();
  reset();
  draw();
})();

<div style="margin-top:14px; font-size:11px; letter-spacing:1px; color:#6f9a72;">Creado por Agustino López</div>
</script>
</body>
</html>
